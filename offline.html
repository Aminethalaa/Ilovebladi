<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>بلديتي — غير متصل</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#f6f8f7;color:#1c2422;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}
.box{max-width:420px}
.ico{font-size:4rem}
h1{color:#006233}
p{color:#64716c}
button{background:#006233;color:#fff;border:none;border-radius:12px;padding:12px 26px;font-size:1rem;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="ico">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحقق من اتصالك ثم أعد المحاولة.<br>Pas de connexion Internet — vérifiez votre connexion puis réessayez.</p>
  <button onclick="location.reload()">إعادة المحاولة — Réessayer</button>
</div>
</body>
</html>
